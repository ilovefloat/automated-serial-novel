name: Semiannual Gemini model audit

on:
  workflow_dispatch:
  schedule:
    # January 5 and July 5 at 11:23 KST.
    - cron: "23 2 5 1,7 *"

permissions:
  contents: read

concurrency:
  group: serial-model-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install latest SDK and project dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --upgrade google-genai

      - name: Test against latest SDK
        env:
          GEMINI_API_KEY: ""
          SERIAL_NOVEL_ALLOW_GEMINI_NETWORK: "0"
        run: |
          python -m py_compile scripts/generate_episode.py scripts/audit_models.py
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py

      - name: Rediscover and probe Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SERIAL_NOVEL_ALLOW_GEMINI_NETWORK: "1"
        run: |
          python scripts/audit_models.py \
            --output model-audit-report.json

      - name: Upload model audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gemini-model-audit-${{ github.run_id }}
          path: model-audit-report.json
          if-no-files-found: warn
          retention-days: 90
