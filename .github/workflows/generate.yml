name: Generate serial episode

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate without committing"
        required: false
        default: false
        type: boolean
  schedule:
    # UTC 토요일 18:00 = KST 일요일 03:00
    - cron: "0 18 * * 6"

permissions:
  contents: write

concurrency:
  group: serial-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate next episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_episode.py

      - name: Rebuild episode index
        run: python scripts/rebuild_index.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-episode
          path: |
            docs/episodes/
            state/story_state.json
          retention-days: 14

      - name: Commit generated episode
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: |
          git config user.name "serial-novel-bot"
          git config user.email "serial-novel-bot@users.noreply.github.com"
          git add docs/ state/story_state.json state/model_catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          episode=$(python -c "import json; print(json.load(open('state/story_state.json', encoding='utf-8'))['next_episode'] - 1)")
          git commit -m "Publish episode ${episode}"
          git push
