name: Generate serial episode

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview artifact only; do not change or commit repository files"
        required: false
        default: false
        type: boolean
  schedule:
    # Four independent chances per KST day, away from the top of the hour.
    # KST 03:17, 07:47, 12:17, 18:47
    - cron: "17 18 * * *"
    - cron: "47 22 * * *"
    - cron: "17 3 * * *"
    - cron: "47 9 * * *"

permissions:
  contents: write

concurrency:
  group: serial-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      episode_path: ${{ steps.episode_result.outputs.episode_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate repository
        env:
          GEMINI_API_KEY: ""
          SERIAL_NOVEL_ALLOW_GEMINI_NETWORK: "0"
        run: |
          python -m py_compile scripts/generate_episode.py scripts/audit_models.py scripts/narrative_control.py scripts/rebuild_index.py scripts/validate_repository.py
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py

      - name: Select run mode
        id: mode
        shell: bash
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_DRY_RUN}" == "true" ]]; then
            echo "preview=true" >> "${GITHUB_OUTPUT}"
          else
            echo "preview=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate next episode
        id: generate_episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SERIAL_NOVEL_ALLOW_GEMINI_NETWORK: "1"
          PREVIEW: ${{ steps.mode.outputs.preview }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          daily_args=()
          if [[ "${SCHEDULED_RUN}" == "true" ]]; then
            daily_args+=(--skip-if-generated-today)
          fi
          if [[ "${PREVIEW}" == "true" ]]; then
            python scripts/generate_episode.py \
              --preview-dir preview \
              --result-json "${RUNNER_TEMP}/generation-result.json" \
              "${daily_args[@]}"
          else
            python scripts/generate_episode.py \
              --result-json "${RUNNER_TEMP}/generation-result.json" \
              "${daily_args[@]}"
          fi

      - name: Export exact generated episode path
        id: episode_result
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "generation-result.json").read_text(
                  encoding="utf-8"
              )
          )
          path = result.get("episode_path", "")
          if result["mode"] == "publish" and path:
              if not path.startswith("docs/episodes/") or not path.endswith(".md"):
                  raise SystemExit("unsafe generated episode path")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"episode_path={path}\n")
          PY

      - name: Rebuild episode index
        if: ${{ steps.mode.outputs.preview == 'false' }}
        run: python scripts/rebuild_index.py

      - name: Upload preview artifact
        if: ${{ steps.mode.outputs.preview == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: serial-episode-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated episode
        if: ${{ steps.mode.outputs.preview == 'false' }}
        run: |
          git config user.name "serial-novel-bot"
          git config user.email "serial-novel-bot@users.noreply.github.com"
          git add docs/episodes/ docs/index.html docs/episodes.json \
            state/story_state.json state/model_catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          episode=$(python -c "import json; print(json.load(open('state/story_state.json', encoding='utf-8'))['next_episode'] - 1)")
          git commit -m "Publish episode ${episode}"
          git push origin HEAD:main

  publish-novelpia:
    if: ${{ needs.generate.outputs.episode_path != '' }}
    needs: generate
    uses: ./.github/workflows/publish-novelpia.yml
    with:
      episode_path: ${{ needs.generate.outputs.episode_path }}
      preview_only: false
      force_republish: false
      refresh_session_only: false
    secrets: inherit
