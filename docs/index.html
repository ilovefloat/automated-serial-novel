<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="인간과 AI가 함께 작성하고 자동으로 연재하는 소설">
  <title>승인되지 않은 문장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">AUTOMATED SERIAL FICTION</p>
        <h1>승인되지 않은 문장</h1>
      </div>
      <p class="intro">
        기계가 작성하고 인간이 책임지는 시대에 관한 연재소설.
        이 사이트의 원고 생성과 배포 과정 역시 자동화되어 있습니다.
      </p>
    </header>

    <section class="episode-section" aria-labelledby="episodes-title">
      <h2 id="episodes-title">연재 목록</h2>
      <ol class="episodes">
        <li class="empty">아직 생성된 에피소드가 없습니다.</li>
      </ol>
    </section>

    <footer>
      <p>본문과 생성 기록은 Git 저장소의 변경 이력에 남습니다.</p>
    </footer>
  </main>
</body>
</html>
